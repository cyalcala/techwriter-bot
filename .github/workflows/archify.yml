name: Validate static Archify artifacts

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Archify static artifacts
        run: npm run archify:check

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Create exact-SHA backup and restore drill
        run: node scripts/backup-archify.mjs create --output ci-artifacts/archify-backup

      - name: Upload verified backup bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archify-backup-${{ github.sha }}
          path: ci-artifacts/archify-backup
          if-no-files-found: error
          retention-days: 30
